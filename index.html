<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RCPsych eLearning Hub Mystery Prize Wheel</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    .corner-logo {
      position: fixed;
      top: 20px;
      left: 10px;

      width: 120px;
      height: auto;
      z-index: 100;

      transform-origin: top left;
      transition: transform 0.2s ease;
      will-change: transform;
    }

    .title {
      font-family: "Montserrat", sans-serif;
      font-weight: 800;
      text-align: center;
      font-size: 32px;
      margin-top: 1px;
      margin-bottom: 20px;

      background: linear-gradient(
        135deg,
        #e6bd2f 0%,
        #fff066 14%,
        #d9aa1f 30%,
        #fff36a 48%,
        #e8c22f 64%,
        #ffe85c 80%,
        #c39212 100%
      );

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;

      text-shadow: 0 1px 0 rgba(0,0,0,0.3),
                   0 2px 5px rgba(0,0,0,0.35);
    }

    .game-wrapper {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      max-width: 1200px;
    }

    .wheel-section {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .wheel-container {
      position: relative;
      width: 500px;
      height: 500px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }

    .wheel-container::before {
      content: "";
      position: absolute;
      width: 510px;
      height: 510px;
      border-radius: 50%;
      border: 4px solid rgba(255,255,255,0.9);
      box-shadow:
        0 0 0 2px rgba(255,255,255,0.12),
        0 10px 20px rgba(0,0,0,0.35);
      z-index: 5;
      pointer-events: none;
    }

    canvas {
      position: relative;
      z-index: 10;
    }

    .pointer {
      position: absolute;
      top: -5px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      z-index: 80;
      border-left: 16px solid transparent;
      border-right: 16px solid transparent;
      border-top: 35px solid red;
    }

    .spin-button {
      position: absolute;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 6px solid white;
      background: #00528c;
      color: white;
      font-family: "Montserrat", sans-serif;
      font-size: 28px;
      font-weight: 800;
      cursor: pointer;
      z-index: 20;
    }

    .spin-button:hover { background:#003f6b; transform: scale(1.05); }
    .spin-button:active { transform: scale(0.98); }

    .info-panel {
      position: absolute;
      right: 40px;
      top: 50%;
      transform: translateY(-50%);
      width: 200px;
      color: white;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(4px);
      padding: 20px;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    #result {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 10px;
      text-align: center;
    }

    .subtext {
      font-size: 16px;
      margin-top: 6px;
      text-align: center;
    }

    .qr {
      width: 140px;
      height: auto;
      margin-top: 10px;
      display: block;
    }

    @media (max-width: 1024px) {

      .corner-logo {
        transform: scale(0.67);
      }

      .title {
        font-size: 24px;
        padding: 0 20px;
      }

      .game-wrapper {
        flex-direction: column;
        gap: 25px;
      }

      .wheel-container {
        width: 380px;
        height: 380px;
      }

      .wheel-container::before {
        width: 390px;
        height: 390px;
      }

      canvas {
        width: 380px !important;
        height: 380px !important;
      }

      .spin-button {
        width: 90px;
        height: 90px;
        font-size: 20px;
      }

      .info-panel {
        position: relative;
        right: auto;
        top: auto;
        transform: none;
        width: 80%;
        max-width: 320px;
      }
    }
  </style>
</head>

<body>

  <img src="20_years.png" class="corner-logo" />
  <h1 class="title">RCPsych eLearning Hub Mystery Prize</h1>

  <div class="game-wrapper">

    <div class="wheel-section">
      <div class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheel" width="500" height="500"></canvas>
        <button class="spin-button" id="spinBtn">SPIN</button>
      </div>
    </div>

    <div class="info-panel">
      <div id="result">Spin the wheel!</div>
    </div>

  </div>

<script>
const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");

const segments = 10;
const colors = ["#00528c", "#ffffff"];
const wheelRadius = 240;

const centerX = canvas.width / 2;
const centerY = canvas.height / 2;

let currentRotation = 0;
let spinning = false;

function drawWheel(rotation = 0) {

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const anglePerSegment = (Math.PI * 2) / segments;

  for (let i = 0; i < segments; i++) {

    const startAngle = i * anglePerSegment + rotation;
    const endAngle = startAngle + anglePerSegment;

    ctx.beginPath();
    ctx.moveTo(centerX, centerY);
    ctx.arc(centerX, centerY, wheelRadius, startAngle, endAngle);
    ctx.fillStyle = colors[i % 2];
    ctx.fill();
    ctx.strokeStyle = "#000";
    ctx.stroke();

    const midAngle = startAngle + anglePerSegment / 2;

    const textX = (wheelRadius - 40) * Math.cos(midAngle);
    const textY = (wheelRadius - 40) * Math.sin(midAngle);

    ctx.save();
    ctx.translate(centerX + textX, centerY + textY);
    ctx.rotate(midAngle + Math.PI / 2);

    ctx.fillStyle = i % 2 ? "black" : "white";
    ctx.font = "bold 24px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillText(i + 1, 0, 0);

    ctx.restore();
  }

  ctx.beginPath();
  ctx.arc(centerX, centerY, 65, 0, Math.PI * 2);
  ctx.fillStyle = "#003f6b";
  ctx.fill();
}

drawWheel();

function getWinningSegment() {
  const anglePerSegment = 360 / segments;
  let degrees = (currentRotation * 180 / Math.PI) % 360;
  degrees = (degrees + 360) % 360;
  const pointerAngle = (270 - degrees + 360) % 360;
  return Math.floor(pointerAngle / anglePerSegment) + 1;
}

function spinWheel() {
  if (spinning) return;
  spinning = true;

  const start = currentRotation;
  const target = start + 5 * Math.PI * 2 + Math.random() * Math.PI * 2;

  const startTime = performance.now();

  function animate(t) {
    const p = Math.min((t - startTime) / 4000, 1);
    const ease = 1 - Math.pow(1 - p, 3);

    currentRotation = start + (target - start) * ease;
    drawWheel(currentRotation);

    if (p < 1) requestAnimationFrame(animate);
    else {
      spinning = false;

      const prizeNumber = getWinningSegment();

      document.getElementById("result").innerHTML =
        "<strong>Prize " + prizeNumber + "</strong><br>" +
        "<span class='subtext'>Hoarding Podcast</span>" +
        "<img src='1_hoarding.png' class='qr'>";
    }
  }

  requestAnimationFrame(animate);
}

document.getElementById("spinBtn").onclick = spinWheel;
</script>

</body>
</html>
