<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RCPsych eLearning Hub Mystery Prize Wheel</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    .corner-logo {
      position: fixed;
      top: 20px;
      left: 10px;
      width: 120px;
      height: auto;
      z-index: 100;
      transform-origin: top left;
      transition: transform 0.2s ease;
      will-change: transform;
      cursor: pointer;
    }

    .title-image {
      display: block;
      max-width: 1000px;
      width: 90%;
      height: auto;
      margin-top: 10px;
      margin-bottom: 80px;
    }

    .game-wrapper {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 30px;
      width: 100%;
      max-width: 1200px;
    }

    .wheel-section {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .wheel-container {
      position: relative;
      width: 500px;
      height: 500px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }

    .wheel-container::before {
      content: "";
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 4px solid rgba(255,255,255,0.9);
      box-shadow:
        0 0 0 2px rgba(255,255,255,0.12),
        0 10px 20px rgba(0,0,0,0.35);
      z-index: 5;
      pointer-events: none;
    }

    canvas {
      position: relative;
      z-index: 10;
    }

    .pointer {
      position: absolute;
      top: -5px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      z-index: 80;
      border-left: 16px solid transparent;
      border-right: 16px solid transparent;
      border-top: 35px solid red;
    }

    .spin-button {
      position: absolute;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 6px solid white;
      background: #00528c;
      color: white;
      font-family: "Montserrat", sans-serif;
      font-size: 28px;
      font-weight: 800;
      cursor: pointer;
      z-index: 20;
    }

    .spin-button:hover { background:#003f6b; transform: scale(1.05); }
    .spin-button:active { transform: scale(0.98); }

    .info-panel {
      width: 180px;
      color: white;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(4px);
      padding: 15px;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    #result {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
      text-align: center;
    }

    .qr {
      width: 90px;
      height: auto;
      margin-top: 8px;
      display: block;
    }

    #confetti {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 999;
    }

    @media (max-width: 1366px) and (orientation: landscape) {
      .game-wrapper {
        gap: 20px;
      }

      .wheel-container {
        width: 450px;
        height: 450px;
      }

      canvas#wheel {
        width: 450px;
        height: 450px;
      }

      .info-panel {
        width: 160px;
        padding: 12px;
      }

      .title-image {
        max-width: 600px;
        margin-top: -50px;
      }
    }
  </style>
</head>

<body>

  <img src="20_years.png" class="corner-logo" onclick="resetWheel()" />
  <img src="elearning_title.png" class="title-image" alt="RCPsych eLearning Hub Mystery Prize">

  <div class="game-wrapper">

    <div class="wheel-section">
      <div class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheel" width="500" height="500"></canvas>
        <button class="spin-button" id="spinBtn">SPIN</button>
      </div>
    </div>

    <div class="info-panel">
      <div id="result">Spin the wheel!</div>
    </div>

  </div>

  <canvas id="confetti"></canvas>

<script>
const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");

const confettiCanvas = document.getElementById("confetti");
const cctx = confettiCanvas.getContext("2d");

confettiCanvas.width = window.innerWidth;
confettiCanvas.height = window.innerHeight;

let confetti = [];
let currentRotation = 0;
let spinning = false;

function resetWheel() {
  spinning = false;
  currentRotation = 0;
  confetti = [];
  cctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
  drawWheel(0);
  document.getElementById("result").innerHTML = "Spin the wheel!";
}

function burstConfetti() {
  const rect = document.querySelector(".wheel-container").getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;

  const colors = ["#e6bd2f", "#fff066", "#d9aa1f", "#ffffff", "#00528c"];

  for (let i = 0; i < 160; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 7 + 3;

    confetti.push({
      x: cx,
      y: cy,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      gravity: 0.08,
      size: Math.random() * 6 + 3,
      color: colors[Math.floor(Math.random() * colors.length)]
    });
  }

  animateConfetti();
}

function animateConfetti() {
  cctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);

  confetti.forEach((p, i) => {
    p.vy += p.gravity;
    p.x += p.vx;
    p.y += p.vy;

    cctx.fillStyle = p.color;
    cctx.fillRect(p.x, p.y, p.size, p.size);

    if (
      p.x < -50 ||
      p.x > confettiCanvas.width + 50 ||
      p.y > confettiCanvas.height + 50
    ) {
      confetti.splice(i, 1);
    }
  });

  if (confetti.length > 0) {
    requestAnimationFrame(animateConfetti);
  }
}

const prizeData = {
  1: { title: "Hoarding podcast", img: "1_hoarding.png" },
  2: { title: "Catatonia podcast", img: "2_catatonia.png" },
  3: { title: "Chemsex: sexualised drug use module", img: "3_chemsex.png" },
  4: { title: "The art of deprescribing: The Maudsley Deprescribing Guidelines podcast", img: "4_deprescribing.png" },
  5: { title: "Adult ADHD module", img: "5_adultadhdmod.png" },
  6: { title: "Safe process for in-patient discharge: England and Wales module", img: "6_safe_process.png" },
  7: { title: "Rapid tranquillisation of the acutely disturbed patient module", img: "7_rapid.png" },
  8: { title: "Anxiety disorders in the perinatal period module", img: "8_perinatal.png" },
  9: { title: "Gambling disorder and gambling-related harms podcast", img: "9_gambling.png" },
  10:{ title: "Evidence-based mental health module", img: "10_ebmh.png" }
};

const segments = 10;
const colors = ["#00528c", "#ffffff"];
const wheelRadius = 240;

const centerX = canvas.width / 2;
const centerY = canvas.height / 2;

function drawWheel(rotation = 0) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const anglePerSegment = (Math.PI * 2) / segments;

  for (let i = 0; i < segments; i++) {
    const startAngle = i * anglePerSegment + rotation;
    const endAngle = startAngle + anglePerSegment;

    ctx.beginPath();
    ctx.moveTo(centerX, centerY);
    ctx.arc(centerX, centerY, wheelRadius, startAngle, endAngle);
    ctx.fillStyle = colors[i % 2];
    ctx.fill();
    ctx.strokeStyle = "#000";
    ctx.stroke();

    const midAngle = startAngle + anglePerSegment / 2;
    const textX = (wheelRadius - 40) * Math.cos(midAngle);
    const textY = (wheelRadius - 40) * Math.sin(midAngle);

    ctx.save();
    ctx.translate(centerX + textX, centerY + textY);
    ctx.rotate(midAngle + Math.PI / 2);

    ctx.fillStyle = i % 2 ? "black" : "white";
    ctx.font = "bold 24px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillText(i + 1, 0, 0);
    ctx.restore();
  }

  ctx.beginPath();
  ctx.arc(centerX, centerY, 65, 0, Math.PI * 2);
  ctx.fillStyle = "#003f6b";
  ctx.fill();
}

drawWheel();

function getWinningSegment() {
  const anglePerSegment = 360 / segments;
  let degrees = (currentRotation * 180 / Math.PI) % 360;
  degrees = (degrees + 360) % 360;
  const pointerAngle = (270 - degrees + 360) % 360;
  return Math.floor(pointerAngle / anglePerSegment) + 1;
}

function spinWheel() {
  if (spinning) return;
  spinning = true;

  const start = currentRotation;
  const target = start + 5 * Math.PI * 2 + Math.random() * Math.PI * 2;

  const startTime = performance.now();

  function animate(t) {
    const p = Math.min((t - startTime) / 4000, 1);
    const ease = 1 - Math.pow(1 - p, 3);

    currentRotation = start + (target - start) * ease;
    drawWheel(currentRotation);

    if (p < 1) requestAnimationFrame(animate);

    else {
      spinning = false;
      burstConfetti();

      const prizeNumber = getWinningSegment();
      const prize = prizeData[prizeNumber];

      document.getElementById("result").innerHTML =
        "<div style='text-align:center'>" +
          "<div style='font-size:20px;font-weight:800;margin-bottom:6px;'>Prize " + prizeNumber + "</div>" +
          "<div style='font-size:14px;margin-bottom:8px;'>" + prize.title + "</div>" +
          "<img src='" + prize.img + "' class='qr' style='margin:0 auto;display:block;'>" +
        "</div>";
    }
  }

  requestAnimationFrame(animate);
}

document.getElementById("spinBtn").onclick = spinWheel;
</script>

</body>
</html>
