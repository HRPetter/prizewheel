<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RCPsych eLearning Hub Mystery Prize Wheel</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #000;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .corner-logo {
      position: fixed;
      top: 20px;
      left: 10px;
      width: 120px;
      z-index: 100;
      cursor: pointer;
    }

    .title-image {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      max-width: 700px;
      width: 90%;
      z-index: 50;
    }

    .game-wrapper {
      position: relative;
      width: 100%;
      height: 100vh;
    }

    /* WHEEL CENTERED */
    .wheel-container {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 520px;
      height: 520px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wheel-container::before {
      content: "";
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 4px solid rgba(255,255,255,0.9);
      box-shadow: 0 10px 20px rgba(0,0,0,0.35);
      z-index: 5;
    }

    canvas {
      z-index: 10;
    }

    .pointer {
      position: absolute;
      top: -5px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 16px solid transparent;
      border-right: 16px solid transparent;
      border-top: 35px solid red;
      z-index: 80;
    }

    .spin-button {
      position: absolute;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 6px solid white;
      background: #00528c;
      color: white;
      font-size: 28px;
      font-weight: 800;
      cursor: pointer;
      z-index: 20;

      display: flex;
      align-items: center;
      justify-content: center;

      line-height: 1;
      text-align: center;
    }

    /* WIN OVERLAY (CENTER OF WHEEL) */
    .win-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      background: rgba(0,0,0,0.35);
      border-radius: 50%;
    }

    .hidden {
      display: none;
    }

    .win-box {
      text-align: center;
      color: white;
      padding: 18px;
      background: rgba(0,0,0,0.65);
      border-radius: 16px;
      backdrop-filter: blur(6px);
      max-width: 80%;
    }

    .win-title {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .win-text {
      font-size: 16px;
      margin-bottom: 12px;
    }

    .win-img {
      width: 140px;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    #confetti {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
    }
  </style>
</head>

<body>

  <img src="20_years.png" class="corner-logo" onclick="resetWheel()" />
  <img src="elearning_title.png" class="title-image">

  <div class="game-wrapper">

    <div class="wheel-container">
      <div class="pointer"></div>

      <canvas id="wheel" width="520" height="520"></canvas>

      <button class="spin-button" id="spinBtn">SPIN</button>


      <div id="winOverlay" class="win-overlay hidden">
        <div class="win-box">
          <div id="winTitle" class="win-title"></div>
          <div id="winText" class="win-text"></div>
          <img id="winImg" class="win-img" />
        </div>
      </div>

    </div>
  </div>

  <canvas id="confetti"></canvas>

<script>
const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");

const confettiCanvas = document.getElementById("confetti");
const cctx = confettiCanvas.getContext("2d");

confettiCanvas.width = window.innerWidth;
confettiCanvas.height = window.innerHeight;

let confetti = [];
let currentRotation = 0;
let spinning = false;

/* OVERLAY */
const overlay = document.getElementById("winOverlay");
const winTitle = document.getElementById("winTitle");
const winText = document.getElementById("winText");
const winImg = document.getElementById("winImg");

/* RESET */
function resetWheel() {
  spinning = false;
  currentRotation = 0;
  confetti = [];
  cctx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);
  drawWheel(0);
  overlay.classList.add("hidden");
}

/* CONFETTI */
function burstConfetti() {
  const rect = document.querySelector(".wheel-container").getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;

  const colors = ["#e6bd2f","#fff066","#d9aa1f","#ffffff","#00528c"];

  for (let i = 0; i < 160; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = Math.random() * 7 + 3;

    confetti.push({
      x: cx,
      y: cy,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s,
      gravity: 0.08,
      size: Math.random() * 6 + 3,
      color: colors[Math.floor(Math.random() * colors.length)]
    });
  }

  animateConfetti();
}

function animateConfetti() {
  cctx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);

  confetti.forEach((p,i)=>{
    p.vy += p.gravity;
    p.x += p.vx;
    p.y += p.vy;

    cctx.fillStyle = p.color;
    cctx.fillRect(p.x,p.y,p.size,p.size);

    if(p.y > confettiCanvas.height + 50) confetti.splice(i,1);
  });

  if(confetti.length) requestAnimationFrame(animateConfetti);
}

/* PRIZES */
const prizeData = {
  1:{title:"Hoarding podcast",img:"1_hoarding.png"},
  2:{title:"Catatonia podcast",img:"2_catatonia.png"},
  3:{title:"Chemsex module",img:"3_chemsex.png"},
  4:{title:"Deprescribing podcast",img:"4_deprescribing.png"},
  5:{title:"Adult ADHD module",img:"5_adultadhdmod.png"},
  6:{title:"Safe discharge module",img:"6_safe_process.png"},
  7:{title:"Rapid tranquillisation module",img:"7_rapid.png"},
  8:{title:"Perinatal anxiety module",img:"8_perinatal.png"},
  9:{title:"Gambling harms podcast",img:"9_gambling.png"},
  10:{title:"Evidence-based mental health module",img:"10_ebmh.png"}
};

/* WHEEL */
const segments = 10;
const wheelRadius = 260;
const centerX = canvas.width / 2;
const centerY = canvas.height / 2;

function drawWheel(rotation = 0) {
  ctx.clearRect(0,0,520,520);

  const step = (Math.PI * 2) / segments;

  for (let i = 0; i < segments; i++) {
    const start = i * step + rotation;
    const end = start + step;

    ctx.beginPath();
    ctx.moveTo(centerX, centerY);
    ctx.arc(centerX, centerY, wheelRadius, start, end);
    ctx.fillStyle = i % 2 ? "#fff" : "#00528c";
    ctx.fill();
    ctx.stroke();

    const mid = start + step / 2;

    ctx.save();
    ctx.translate(
      centerX + (wheelRadius - 40) * Math.cos(mid),
      centerY + (wheelRadius - 40) * Math.sin(mid)
    );
    ctx.rotate(mid + Math.PI / 2);
    ctx.fillStyle = i % 2 ? "black" : "white";
    ctx.font = "bold 22px Arial";
    ctx.fillText(i + 1, 0, 0);
    ctx.restore();
  }

  ctx.beginPath();
  ctx.arc(centerX, centerY, 65, 0, Math.PI * 2);
  ctx.fillStyle = "#003f6b";
  ctx.fill();
}

drawWheel();

function getWinner() {
  let deg = (currentRotation * 180 / Math.PI) % 360;
  deg = (deg + 360) % 360;
  return Math.floor(((270 - deg + 360) % 360) / (360 / segments)) + 1;
}

/* SPIN */
function spinWheel() {
  if (spinning) return;
  spinning = true;

  const start = currentRotation;
  const target = start + Math.PI * 10 + Math.random() * Math.PI * 2;
  const t0 = performance.now();

  function anim(t) {
    const p = Math.min((t - t0) / 4000, 1);
    const e = 1 - Math.pow(1 - p, 3);

    currentRotation = start + (target - start) * e;
    drawWheel(currentRotation);

    if (p < 1) requestAnimationFrame(anim);
    else {
      spinning = false;
      burstConfetti();

      const prizeNumber = getWinner();
      const prize = prizeData[prizeNumber];

      winTitle.textContent = `Prize ${prizeNumber}`;
      winText.textContent = prize.title;
      winImg.src = prize.img;

      overlay.classList.remove("hidden");
    }
  }

  requestAnimationFrame(anim);
}

document.getElementById("spinBtn").onclick = spinWheel;
</script>

</body>
</html>
